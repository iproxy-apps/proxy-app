# Resets the local DB, seeds one user and signs in through the UI. Ends on the tabs.
# Params (runFlow env: or -e): EMAIL, PASSWORD, USER_TYPE (CLIENT|PROXY), READY (default 0),
# API (default http://localhost:3333).
appId: com.anonymous.proxyapp
---
- runScript:
    file: seed.js
    env:
      API: ${API || 'http://localhost:3333'}
      EMAIL: ${EMAIL}
      PASSWORD: ${PASSWORD}
      USER_TYPE: ${USER_TYPE}
      READY: ${READY || '0'}
# clearState does not wipe the iOS keychain (SecureStore session); clear it to start signed out.
- clearKeychain
- launchApp:
    clearState: true
- tapOn: "Já tenho conta"
- tapOn: "voce@email.com"
- inputText: ${EMAIL}
- tapOn: "Sua senha"
- inputText: ${PASSWORD}
- tapOn: "Entrar"
# iOS offers to store the password in a system sheet that covers the tabs; dismiss it when shown.
- extendedWaitUntil:
    visible: "Not Now"
    timeout: 8000
    optional: true
- tapOn:
    text: "Not Now"
    optional: true
# Tab buttons expose "<label>, tab, n of m" on iOS and Maestro full-matches the regex.
- extendedWaitUntil:
    visible: "Perfil, tab.*"
    timeout: 15000
